[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".venv-wsl", "backend/.venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
