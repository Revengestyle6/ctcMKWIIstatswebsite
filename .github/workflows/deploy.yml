name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_DB: ctc_test
          POSTGRES_USER: ctc_test
          POSTGRES_PASSWORD: ctc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctc_test -d ctc_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Build regression database
        run: cd backend && python import_json_to_db.py --rebuild

      - name: Check backend
        run: |
          ruff check backend
          ruff format backend --check
          cd backend
          python -m unittest discover -v
          python scripts/compare_phase0_api.py \
            --only seasons,match-scopes,divisions-s3,teams-s3-d1,players-s3-d1,tracks-s3-d1
          python scripts/compare_phase0_api.py \
            --skip-database-health \
            --write-current "$RUNNER_TEMP/sqlite-api"

      - name: Check PostgreSQL migration and API compatibility
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ctc_test:ctc_test@127.0.0.1:5432/ctc_test
        run: |
          alembic upgrade head
          alembic check
          cd backend
          python import_json_to_db.py --database-url "$DATABASE_URL"
          python scripts/compare_phase0_api.py \
            --skip-database-health \
            --fixture-dir "$RUNNER_TEMP/sqlite-api"

      - name: Check Phase 3 PostgreSQL acceptance workflow
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ctc_test:ctc_test@127.0.0.1:5432/ctc_phase3
          PHASE3_POSTGRES_TEST_URL: postgresql+psycopg://ctc_test:ctc_test@127.0.0.1:5432/ctc_phase3
        run: |
          PGPASSWORD=ctc_test createdb -h 127.0.0.1 -U ctc_test ctc_phase3
          alembic upgrade head
          cd backend
          python -m unittest -v test_phase3_postgres_integration.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Check frontend
        run: cd frontend && npm run check

      - name: Build
        run: cd frontend && npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
