<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        const queryLeague = new URLSearchParams(window.location.search).get("league");
        let league = queryLeague === "ctc" || queryLeague === "gsc" ? queryLeague : "gsc";
        if (queryLeague !== "ctc" && queryLeague !== "gsc") {
          try {
            const storedLeague = window.localStorage.getItem("mkw-stats:league:v1");
            if (storedLeague === "ctc" || storedLeague === "gsc") league = storedLeague;
          } catch {
            // GSC remains the default when browser storage is unavailable.
          }
        }

        const favicon = document.createElement("link");
        favicon.id = "league-favicon";
        favicon.rel = "icon";
        favicon.type = league === "gsc" ? "image/png" : "image/webp";
        favicon.href =
          league === "gsc"
            ? "/media/leagues/gsc/branding/favicon.png"
            : "/media/leagues/ctc/branding/logo.webp";
        favicon.dataset.league = league;
        document.head.append(favicon);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Multi-season player, team, track, matchup, and race analytics for Mario Kart Wii leagues."
    />
    <title>Grand Star Cup Statistics</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
